name: Update TOP14 Live

on:
  workflow_dispatch:

  schedule:
    # Samedi toutes les 2 minutes de 15h00 à 22h58
    - cron: '*/2 12-23 * * 6'

    # Dimanche toutes les 2 minutes de 21h00 à 22h58
    - cron: '*/2 19-22 * * 0'

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4 firebase-admin

      - run: python update_top14_live.py
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
